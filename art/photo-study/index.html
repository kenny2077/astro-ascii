<!doctype html>
<html lang="zh-Hans">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Astro photo study — ASCII / Pixel</title>
<style>
:root{color-scheme:dark;--ground:#080a0e;--ink:#e3ded5;--muted:#a6a7ad;--line:#303239;--active:#e1bc8b}
*{box-sizing:border-box}body{margin:0;background:var(--ground);color:var(--ink);font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace}main{max-width:1600px;margin:auto;padding:24px 28px}header{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:20px}h1{font-family:inherit;font-size:21px;font-weight:400;line-height:1.2;margin:0}p{margin:5px 0;color:var(--muted)}nav,.tools{display:flex;gap:7px;flex-wrap:wrap;align-items:center}button,select{font:inherit;color:var(--ink);background:transparent;border:1px solid var(--line);padding:8px 12px;border-radius:4px;min-height:40px;cursor:pointer}button[aria-pressed=true]{border-color:var(--active);color:var(--active)}button:hover,select:hover{background:#202128}button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--active);outline-offset:4px}input{accent-color:var(--active);width:115px}label{display:flex;gap:10px;align-items:center}a{color:var(--active);text-underline-offset:3px}::selection{background:var(--active);color:var(--ground)}.stage{display:grid;grid-template-columns:1fr;gap:20px;align-items:start}.stage.compare{grid-template-columns:1fr 1fr}figure{margin:0;min-width:0}canvas,img{width:100%;height:auto;display:block;aspect-ratio:2560/1673;background:#07080b}figcaption{margin-top:8px;color:var(--muted);font-size:12px}.tools{justify-content:space-between;margin-top:22px;padding-top:16px;border-top:1px solid var(--line);gap:16px}.controls{display:flex;align-items:center;gap:18px;flex-wrap:wrap}footer{margin-top:20px;font-size:12px;max-width:100ch;color:var(--muted)}[hidden]{display:none!important}.shot main{padding:0}.shot header,.shot .tools,.shot footer,.shot figcaption{display:none}.shot main{max-width:none}.shot .stage{gap:0}
@media(min-width:1000px){.stage:not(.compare){max-width: min(100%,calc((100vh - 245px)*1.5302));margin:auto}}
@media(max-width:700px){main{padding:18px 14px}header{display:block}nav{margin-top:16px}.stage.compare{grid-template-columns:1fr}.controls{gap:12px}h1{font-size:19px}}
</style>
<main>
<header><div><h1>Astro photo study</h1><p>同一片星云，两种动态表达。</p></div><nav aria-label="观看方式"><button data-mode="ascii" aria-pressed="true">ASCII</button><button data-mode="pixel" aria-pressed="false">Pixel</button><button data-mode="compare" aria-pressed="false">并排比较</button><button data-mode="original" aria-pressed="false">原图</button></nav></header>
<section class="stage" aria-label="星云作品"><figure id="asciiFigure"><canvas id="ascii" role="img" aria-label="从原照片采样的彩色字符星云动画"></canvas><figcaption id="asciiCaption">ASCII · scenes 点阵（Unicode）</figcaption></figure><figure id="pixelFigure" hidden><canvas id="pixel" role="img" aria-label="从同一原照片采样的像素星云动画"></canvas><figcaption>Pixel · 相同采样网格与动态</figcaption></figure><figure id="originalFigure" hidden><img id="original" alt="你选择的天文照片"><figcaption>原图 · 权利归原作者所有</figcaption></figure></section>
<div class="tools"><div class="controls"><label>加载本地照片 <input id="source" type="file" accept="image/jpeg,image/png,image/webp"></label><button id="play" aria-pressed="true">暂停</button><label>动态 <input id="motion" type="range" min="0" max="100" value="55"><output id="amount">55%</output></label><label>字符 <select id="glyph"><option value="dots">scenes 点阵 · • ●</option><option value="strict">严格 ASCII . : + * o O @</option></select></label></div><p id="status" role="status">选择本地照片开始；图片不会上传。</p></div>
<footer>照片由你在本地选择。请仅使用你有权使用的图片。参考 <a href="https://github.com/bas3line/ascii" target="_blank" rel="noreferrer">bas3line/ascii</a> 的 scenes 点阵与 Bayer dithering，自定义离线 renderer。星点位置和星云轮廓固定；亮度变化是艺术效果，不代表真实天体运动。原图模式可检查构图与颜色。</footer>
</main>
<script>
// Scene glyphs and ordered dithering reference: bas3line/ascii, MIT (see LICENSE-bas3line.txt).
let sourceURL;
const W=240,H=157,S=6,N=W*H,LOOP=16,TAU=Math.PI*2;
const BAYER=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5];
const $=s=>document.querySelector(s), params=new URLSearchParams(location.search);
let animationStarted=false;
let mode=params.get('mode')||'ascii',paused=matchMedia('(prefers-reduced-motion: reduce)').matches||params.has('t'),time=Number(params.get('t')||0),last=0,ready=false;
const make=(w,h)=>Object.assign(document.createElement('canvas'),{width:w,height:h});
const small=make(W,H),sc=small.getContext('2d'),mask=make(W*S,H*S),mc=mask.getContext('2d');
const tint=make(W,H),tc=tint.getContext('2d'),pi=tc.createImageData(W,H),ai=tc.createImageData(W,H);
const ac=$('#ascii').getContext('2d'),pc=$('#pixel').getContext('2d');
for(const c of [ac,pc]){c.canvas.width=W*S;c.canvas.height=H*S;c.imageSmoothingEnabled=false;}
const base=new Float32Array(N*3),gain=new Float32Array(N),stars=new Float32Array(N),phase=new Float32Array(N),cloud=new Float32Array(N);
let letters=[];
const hash=k=>{let h=Math.imul(k+1,374761393);h=Math.imul(h^(h>>>13),1274126177);return ((h^(h>>>16))>>>0)/4294967296};
function rebuildMask(){
 const glyphs=$('#glyph').value==='dots'?[' ','·','•','●']:[' ','.',':','+','*','o','O','@'];
 const tile=make(S,S),c=tile.getContext('2d');c.font=`${S*1.65}px Menlo,monospace`;c.textAlign='center';c.textBaseline='middle';
 const levels=glyphs.map(char=>{c.clearRect(0,0,S,S);c.fillStyle='#fff';c.fillText(char,S/2,S/2);const d=c.getImageData(0,0,S,S).data;let a=0;for(let i=3;i<d.length;i+=4)a+=d[i]/255;return {char,cover:a/(S*S)}}).sort((a,b)=>a.cover-b.cover);
 mc.clearRect(0,0,mask.width,mask.height);mc.font=c.font;mc.textAlign='center';mc.textBaseline='middle';mc.fillStyle='#fff';letters=[];
 for(let k=0;k<N;k++){
  const x=k%W,y=Math.floor(k/W),peak=Math.max(base[k*3],base[k*3+1],base[k*3+2]);
  const value=Math.min(.94,.40+peak*1.1),need=Math.min(levels.at(-1).cover,peak/value);
  let i=0;while(i<levels.length-2&&need>levels[i+1].cover)i++;
  const f=(need-levels[i].cover)/(levels[i+1].cover-levels[i].cover||1),level=levels[f>(BAYER[(y&3)*4+(x&3)]+.5)/16?i+1:i];
  gain[k]=Math.min(1.75,value/Math.max(peak,.001));letters[k]=level.char;mc.fillText(level.char,(x+.5)*S,(y+.5)*S);
 }
 $('#asciiCaption').textContent=$('#glyph').value==='dots'?'ASCII · scenes 点阵（Unicode）':'ASCII · 真实字符网格';
}
function render(t){
 if(!ready)return;
 const spin=TAU*((t%LOOP+LOOP)%LOOP)/LOOP,a=Number($('#motion').value)/100;
 for(let k=0;k<N;k++){
  // Fixed coordinates; only source-derived light changes. Integer frequencies close the loop.
  const wave=Math.sin(spin+phase[k]),twinkle=Math.sin(spin*(2+Math.floor(hash(k)*3))+phase[k]);
  const light=1+a*(.055*cloud[k]*wave+.48*stars[k]*twinkle);
  for(let j=0;j<3;j++){const v=base[k*3+j]*light*255;pi.data[k*4+j]=Math.min(255,Math.round(v));ai.data[k*4+j]=Math.min(255,Math.round(v*gain[k]));}
  pi.data[k*4+3]=ai.data[k*4+3]=255;
 }
 if(mode==='pixel'||mode==='compare'){tc.putImageData(pi,0,0);pc.drawImage(tint,0,0,W*S,H*S);}
 if(mode==='ascii'||mode==='compare'){tc.putImageData(ai,0,0);ac.globalCompositeOperation='source-over';ac.clearRect(0,0,W*S,H*S);ac.drawImage(tint,0,0,W*S,H*S);ac.globalCompositeOperation='destination-in';ac.drawImage(mask,0,0);ac.globalCompositeOperation='destination-over';ac.fillStyle='#07080b';ac.fillRect(0,0,W*S,H*S);ac.globalCompositeOperation='source-over';}
}
function setMode(next){mode=next;$('.stage').classList.toggle('compare',mode==='compare');$('#asciiFigure').hidden=!['ascii','compare'].includes(mode);$('#pixelFigure').hidden=!['pixel','compare'].includes(mode);$('#originalFigure').hidden=mode!=='original';document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.mode===mode));render(time);}
function playLabel(){$('#play').textContent=paused?'播放':'暂停';$('#play').setAttribute('aria-pressed',!paused);}
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));
$('#play').onclick=()=>{paused=!paused;last=0;playLabel()};
$('#motion').oninput=()=>{$('#amount').textContent=$('#motion').value+'%';render(time)};
$('#glyph').onchange=()=>{rebuildMask();render(time)};
const reduced=matchMedia('(prefers-reduced-motion: reduce)');reduced.addEventListener('change',e=>{if(e.matches){paused=true;playLabel()}});
document.addEventListener('visibilitychange',()=>last=0);
function tick(now){requestAnimationFrame(tick);if(!ready||paused||document.hidden||mode==='original'){last=0;return}if(!last){last=now;return}const dt=now-last;if(dt<1000/15)return;last=now;time=(time+Math.min(dt,200)/1000)%LOOP;render(time)}
const image=new Image();image.onerror=()=>{$('#status').textContent='原图未能加载，请重新打开文件。'};
image.onload=()=>{
 const source=make(W*S,H*S),ctx=source.getContext("2d");ctx.fillStyle="#07080b";ctx.fillRect(0,0,source.width,source.height);const fit=Math.min(source.width/image.width,source.height/image.height);ctx.drawImage(image,(source.width-image.width*fit)/2,(source.height-image.height*fit)/2,image.width*fit,image.height*fit);sc.drawImage(source,0,0,W,H);const avg=sc.getImageData(0,0,W,H).data;
 // Find source-pixel peaks within each cell so sparse stars survive downsampling.
 const raw=ctx.getImageData(0,0,source.width,source.height).data;
 const peak=new Float32Array(N),peakRGB=new Float32Array(N*3);
 for(let y=0;y<source.height;y++)for(let x=0;x<source.width;x++){
  const k=Math.floor(y/source.height*H)*W+Math.floor(x/source.width*W),q=(y*source.width+x)*4,l=(raw[q]*.2126+raw[q+1]*.7152+raw[q+2]*.0722)/255;
  if(l>peak[k]){peak[k]=l;for(let j=0;j<3;j++)peakRGB[k*3+j]=raw[q+j]/255;}
 }
 for(let k=0;k<N;k++){
  const lum=(avg[k*4]*.2126+avg[k*4+1]*.7152+avg[k*4+2]*.0722)/255;
  stars[k]=Math.max(0,Math.min(1,(peak[k]-lum-.13)*2.6));
  phase[k]=hash(k)*TAU;cloud[k]=Math.max(0,Math.min(1,(lum-.10)*4));
  // A restrained exposure lift, with original RGB ratios retained.
  for(let j=0;j<3;j++)base[k*3+j]=Math.min(.96,(avg[k*4+j]/255*(1-stars[k]*.26)+peakRGB[k*3+j]*stars[k]*.26)*1.12);
  if(cloud[k]>.1)phase[k]=(k%W)/W*3+Math.floor(k/W)/H*2;
 }
 source.width=source.height=1;ready=true;rebuildMask();setMode(mode);playLabel();$('#status').textContent=`240 × 157 · 15 fps · 16 s 循环`;if(!animationStarted){animationStarted=true;requestAnimationFrame(tick);}
};
if(params.has('shot'))document.body.classList.add('shot');
$("#source").onchange=e=>{const file=e.target.files[0];if(!file)return;if(sourceURL)URL.revokeObjectURL(sourceURL);sourceURL=URL.createObjectURL(file);ready=false;$("#status").textContent="正在从原图采样…";$("#original").src=sourceURL;image.src=sourceURL;};
// Deterministic frame access also makes motion and loop closure verifiable.
window.art={render,setMode,get ready(){return ready},get time(){return time},get paused(){return paused},get letters(){return letters.join('')},loop:LOOP};
</script>
</html>
